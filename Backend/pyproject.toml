[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",   # line too long
    "N818",   # AppException naming — changing breaks entire codebase
    "N806",   # uppercase var in function (ESCALATIONS, _DIR_ARROW etc) — intentional constants
    "E722",   # bare except — intentional in json parse fallbacks
    "E701",   # multiple statements on one line — intentional in some places
    "E402",   # module-level import not at top — conftest must set env vars before imports
    "E741",   # ambiguous variable name `l` — minor
    "W291",   # trailing whitespace in docstring — minor
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Disable codes that are pre-existing annotation issues — not runtime bugs
disable_error_code = [
    "prop-decorator",   # @property with extra decorator — cosmetic
    "import-untyped",   # dateutil missing stubs — not our code
    "union-attr",       # None checks already handled at runtime
    "assignment",       # Optional[T] assigned to T — runtime guards exist
    "attr-defined",     # dynamic attributes (pydantic models)
    "override",         # method signature variance in LLM providers
    "abstract",         # BaseExtractor — runtime factory handles this
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
