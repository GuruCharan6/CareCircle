name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Unit tests
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_JWT_SECRET: test-secret-minimum-32-chars-long-string
          SUPABASE_DB_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: test
          DEBUG: "true"
        run: |
          pytest tests/unit/ -v --tb=short \
            --ignore=tests/unit/test_dimension_tagger.py \
            --ignore=tests/unit/test_layer3_rules.py \
            --ignore=tests/unit/test_layer4_temporal.py

      - name: API tests
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_JWT_SECRET: test-secret-minimum-32-chars-long-string
          SUPABASE_DB_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: test
          DEBUG: "true"
        run: pytest tests/api/ -v --tb=short

  push-image:
    name: Build + Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name (GHCR requires lowercase)
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/api:latest

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
